# Manual release-candidate workflow. Public release promotion remains an
# explicit human decision until desktop signing and notarization are enabled.

name: Build and Release

on:
  workflow_dispatch:

# Prevent concurrent builds
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: release
    
    permissions:
      contents: write  # Required for creating releases
    
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build the project (generates static export in 'out' directory)
      - name: Build project
        run: npm run build

      # Generate version tag based on date and short commit hash
      - name: Generate version info
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      # Create release package from static export
      - name: Create release package
        run: |
          # The 'out' directory contains the static export
          cd out
          zip -r ../hushpdf-${{ steps.version.outputs.version }}.zip .
          cd ..
          
          echo "📦 Release package created: hushpdf-${{ steps.version.outputs.version }}.zip"
          echo "📊 Package size: $(du -h hushpdf-${{ steps.version.outputs.version }}.zip | cut -f1)"

      # Create a draft release candidate. Unsigned desktop artifacts are not
      # attached or advertised as production downloads.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: HushPDF ${{ steps.version.outputs.version }}
          body: |
            ## 🚀 HushPDF Release ${{ steps.version.outputs.version }}

            ### Release candidate
            This draft contains the static web export for review. Desktop
            packages are published separately only after signing and
            notarization checks pass.

            ---
            **Commit:** `${{ github.sha }}`
            **Build Time:** ${{ steps.version.outputs.build_time }}
          files: |
            hushpdf-${{ steps.version.outputs.version }}.zip
          draft: true
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
