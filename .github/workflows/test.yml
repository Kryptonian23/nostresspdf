name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Typecheck, lint, tests, and production build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Install billing API dependencies
        run: npm ci
        working-directory: infra/billing

      - name: Test billing API
        run: npm test
        working-directory: infra/billing

      - name: Build static production export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://beta.example.invalid
          NEXT_PUBLIC_BETA_MODE: "true"
          NEXT_PUBLIC_BILLING_MODE: sandbox
