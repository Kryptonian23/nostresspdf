AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Production NoStressPDF Stripe billing API with retained entitlements, Cognito authorization, and monitored webhooks.

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    AllowedPattern: '^[a-z0-9-]+$'
  UserPoolId:
    Type: String
  UserPoolClientId:
    Type: String
  BillingAuthorizationScope:
    Type: String
    Default: hushpdf-billing/access
  AllowedOrigin:
    Type: String
    AllowedPattern: '^https://[^/,]+$'
    Description: Exact HTTPS production origin allowed to call this API.
  StripeSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Existing Secrets Manager ARN containing secretKey and webhookSecret. CloudFormation never receives their values.
  PersonalMonthlyPriceId:
    Type: String
    AllowedPattern: '^price_.+$'
  PersonalAnnualPriceId:
    Type: String
    AllowedPattern: '^price_.+$'
  ProfessionalMonthlyPriceId:
    Type: String
    AllowedPattern: '^price_.+$'
  ProfessionalAnnualPriceId:
    Type: String
    AllowedPattern: '^price_.+$'
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: Optional SNS topic ARN for billing service alarms.

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        ACCOUNTS_TABLE_NAME: !Ref BillingAccountsTable
        STRIPE_SECRET_ARN: !Ref StripeSecretArn
        STRIPE_MODE: live
        ALLOWED_ORIGINS: !Ref AllowedOrigin
        PRICE_PERSONAL_MONTHLY: !Ref PersonalMonthlyPriceId
        PRICE_PERSONAL_ANNUAL: !Ref PersonalAnnualPriceId
        PRICE_PROFESSIONAL_MONTHLY: !Ref ProfessionalMonthlyPriceId
        PRICE_PROFESSIONAL_ANNUAL: !Ref ProfessionalAnnualPriceId

Resources:
  BillingHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref EnvironmentName
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}
              audience: [!Ref UserPoolClientId]

  BillingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hushpdf-billing-${EnvironmentName}
      CodeUri: .
      Handler: src/index.handler
      ReservedConcurrentExecutions: 20
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BillingAccountsTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref StripeSecretArn
      Events:
        Entitlements:
          Type: HttpApi
          Properties:
            ApiId: !Ref BillingHttpApi
            Path: /me/entitlements
            Method: GET
            Auth:
              AuthorizationScopes: [!Ref BillingAuthorizationScope]
        Checkout:
          Type: HttpApi
          Properties:
            ApiId: !Ref BillingHttpApi
            Path: /billing/checkout
            Method: POST
            Auth:
              AuthorizationScopes: [!Ref BillingAuthorizationScope]
        Portal:
          Type: HttpApi
          Properties:
            ApiId: !Ref BillingHttpApi
            Path: /billing/portal
            Method: POST
            Auth:
              AuthorizationScopes: [!Ref BillingAuthorizationScope]
        StripeWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref BillingHttpApi
            Path: /billing/webhook
            Method: POST
            Auth:
              Authorizer: NONE

  BillingFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/hushpdf-billing-${EnvironmentName}
      RetentionInDays: 30

  BillingAccountsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub hushpdf-billing-accounts-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: NoStressPDF
        - Key: Environment
          Value: !Ref EnvironmentName

  BillingFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: NoStressPDF billing Lambda returned errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BillingFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  BillingApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: NoStressPDF billing HTTP API returned server errors.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref BillingHttpApi
        - Name: Stage
          Value: !Ref EnvironmentName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

Outputs:
  BillingApiUrl:
    Value: !Sub https://${BillingHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}
  StripeWebhookUrl:
    Value: !Sub https://${BillingHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/billing/webhook
